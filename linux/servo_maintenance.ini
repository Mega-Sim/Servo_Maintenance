[server]
# The bridge is internal to Linux. It must not be exposed to the Windows network.
listen_host = 127.0.0.1
listen_port = 18766

# Authentication disabled: empty token = no token check.
shared_token =

# No IP restriction (* = any client).
allowed_client_ip = *

# Existing amc_oht maintenance interface.
unix_socket = /tmp/amc_rsa_maintenance.sock
spool_dir = /home/semes/work/bin
max_file_bytes = 1048576
unix_timeout_seconds = 1200

[firmware]
max_file_bytes = 8388608
# AMC axis mapping. Driving front/rear share the same physical dual Servo Pack.
driving_axis = 0
hoist_axis = 2
slide_axis = 3

[connection]
# The Linux web server calls the local bridge. Windows never connects here.
motion_ip = 127.0.0.1
tcp_port = 18766
shared_token =
timeout_seconds = 1200
max_file_bytes = 1048576
max_firmware_bytes = 8388608

[web_ui]
# Windows IPC opens http://192.168.0.2:18765/ in its browser.
host = 0.0.0.0
port = 18765
# No IP restriction (* = any browser).
allowed_browser_ip = *
